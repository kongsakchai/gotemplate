basePath: /
consumes:
    - application/json
host: localhost:8080
info:
    description: Documentation of our Go Template API.
    title: Go Template.
    version: 1.0.0
paths:
    /health:
        get:
            operationId: none
            responses:
                "200":
                    $ref: '#/responses/healthResponse'
                "500":
                    $ref: '#/responses/errorDatabaseResponse'
            summary: Health check endpoint.
            tags:
                - common
    /metrics:
        get:
            operationId: none
            responses:
                "200":
                    $ref: '#/responses/metricsResponse'
            summary: Metrics endpoint.
            tags:
                - common
    /api/v1/auth/register:
        post:
            consumes:
                - application/json
            operationId: registerUser
            parameters:
                - in: body
                  name: body
                  required: true
                  schema:
                      $ref: '#/definitions/RegisterUserParams'
            responses:
                "201":
                    $ref: '#/responses/AuthRegisterResponse'
                "400":
                    $ref: '#/responses/AuthErrorResponse'
                "500":
                    $ref: '#/responses/ErrorInternalResponse'
            summary: Register a new user account.
            tags:
                - auth
    /api/v1/auth/login:
        post:
            consumes:
                - application/json
            operationId: loginUser
            parameters:
                - in: body
                  name: body
                  required: true
                  schema:
                      $ref: '#/definitions/LoginUserParams'
            responses:
                "200":
                    $ref: '#/responses/AuthLoginResponse'
                "400":
                    $ref: '#/responses/AuthErrorResponse'
                "500":
                    $ref: '#/responses/ErrorInternalResponse'
            summary: Login with username and password.
            tags:
                - auth
    /api/v1/todos:
        get:
            operationId: listTodos
            responses:
                "200":
                    $ref: '#/responses/TodoListResponse'
                "400":
                    $ref: '#/responses/TodoEndpointError'
                "401":
                    $ref: '#/responses/UnauthorizedResponse'
                "500":
                    $ref: '#/responses/ErrorInternalResponse'
            security:
                - key: []
            summary: List all todos of the authenticated user.
            tags:
                - todo
        post:
            consumes:
                - application/json
            operationId: createTodo
            parameters:
                - in: body
                  name: body
                  required: true
                  schema:
                      $ref: '#/definitions/CreateTodoParams'
            responses:
                "201":
                    $ref: '#/responses/TodoCreatedResponse'
                "400":
                    $ref: '#/responses/TodoEndpointError'
                "401":
                    $ref: '#/responses/UnauthorizedResponse'
                "500":
                    $ref: '#/responses/ErrorInternalResponse'
            security:
                - key: []
            summary: Create a new todo for the authenticated user.
            tags:
                - todo
    /api/v1/todos/{id}:
        put:
            consumes:
                - application/json
            operationId: updateTodo
            parameters:
                - in: path
                  name: id
                  required: true
                  type: string
                - in: body
                  name: body
                  schema:
                      type: object
                      properties:
                          name:
                              description: New todo name
                              type: string
                          description:
                              description: New todo description
                              type: string
                          status:
                              description: New todo status (e.g., "pending", "done")
                              type: string
            responses:
                "200":
                    $ref: '#/responses/TodoUpdatedResponse'
                "400":
                    $ref: '#/responses/TodoEndpointError'
                "401":
                    $ref: '#/responses/UnauthorizedResponse'
                "500":
                    $ref: '#/responses/ErrorInternalResponse'
            security:
                - key: []
            summary: Update an existing todo of the authenticated user.
            tags:
                - todo
        delete:
            operationId: deleteTodo
            parameters:
                - in: path
                  name: id
                  required: true
                  type: string
            responses:
                "200":
                    $ref: '#/responses/TodoDeletedResponse'
                "400":
                    $ref: '#/responses/TodoEndpointError'
                "401":
                    $ref: '#/responses/UnauthorizedResponse'
                "500":
                    $ref: '#/responses/ErrorInternalResponse'
            security:
                - key: []
            summary: Delete an existing todo of the authenticated user.
            tags:
                - todo
produces:
    - application/json
definitions:
    CreateTodoParams:
        properties:
            name:
                example: Buy groceries
                type: string
            description:
                example: Milk and eggs
                type: string
            status:
                example: pending
                type: string
        required:
            - name
        type: object
    LoginUserParams:
        properties:
            username:
                example: admin
                type: string
            password:
                example: secret
                type: string
        required:
            - username
            - password
        type: object
    RegisterUserParams:
        properties:
            username:
                example: admin
                type: string
            password:
                example: secret
                type: string
        required:
            - username
            - password
        type: object
    Todo:
        properties:
            id:
                type: string
            name:
                type: string
            description:
                type: string
            status:
                type: string
            userId:
                type: string
            createdAt:
                type: string
                format: date-time
        type: object
responses:
    AuthLoginResponse:
        description: Login result containing the JWT token.
        schema:
            properties:
                code:
                    example: 0000
                    type: string
                success:
                    example: true
                    type: boolean
                data:
                    properties:
                        token:
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidXNlcm5hbWUiOiJhZG1pbiJ9.signature
                            type: string
                    type: object
            type: object
    AuthRegisterResponse:
        description: User account created successfully.
        schema:
            properties:
                code:
                    example: 0000
                    type: string
                success:
                    example: true
                    type: boolean
                message:
                    example: Created
                    type: string
            type: object
    AuthErrorResponse:
        description: |
            Error response for auth endpoints. Possible error codes:
              - 1000: bad request (cannot read request body)
              - 1001: invalid request (validation failed)
              - 2000: user already exists
              - 2001: user not found
              - 2002: invalid password
        schema:
            properties:
                code:
                    example: 2000
                    type: string
                success:
                    example: false
                    type: boolean
                message:
                    example: user already exists
                    type: string
            type: object
    ErrorDatabaseResponse:
        description: Database connection error.
        schema:
            properties:
                code:
                    example: 9998
                    type: string
                success:
                    example: false
                    type: boolean
                message:
                    example: database is not ready
                    type: string
            type: object
    ErrorInternalResponse:
        description: Internal server error.
        schema:
            properties:
                code:
                    example: 9999
                    type: string
                success:
                    example: false
                    type: boolean
                message:
                    example: internal error
                    type: string
            type: object
    healthResponse:
        description: Health check response.
        schema:
            properties:
                code:
                    example: 0000
                    type: string
                message:
                    example: healthy
                    type: string
                success:
                    example: true
                    type: boolean
            type: object
    metricsResponse:
        description: System metrics.
        schema:
            properties:
                success:
                    example: true
                    type: boolean
                data:
                    type: object
            type: object
    TodoCreatedResponse:
        description: Todo created successfully.
        schema:
            properties:
                code:
                    example: 0000
                    type: string
                success:
                    example: true
                    type: boolean
                message:
                    example: Created
                    type: string
            type: object
    TodoEndpointError:
        description: |
            Error response for todo endpoints. Possible error codes:
              - 1000: bad request (cannot read request body)
              - 1001: invalid request (validation failed)
              - 3000: user not found
              - 3001: todo not found
        schema:
            properties:
                code:
                    example: 3001
                    type: string
                success:
                    example: false
                    type: boolean
                message:
                    example: todo not found
                    type: string
            type: object
    TodoListResponse:
        description: List of todos belonging to the authenticated user.
        schema:
            properties:
                code:
                    example: 0000
                    type: string
                success:
                    example: true
                    type: boolean
                data:
                    items:
                        $ref: '#/definitions/Todo'
                    type: array
            type: object
    TodoUpdatedResponse:
        description: Todo updated successfully.
        schema:
            properties:
                code:
                    example: 0000
                    type: string
                success:
                    example: true
                    type: boolean
                message:
                    example: Updated
                    type: string
            type: object
    TodoDeletedResponse:
        description: Todo deleted successfully.
        schema:
            properties:
                code:
                    example: 0000
                    type: string
                success:
                    example: true
                    type: boolean
                message:
                    example: Deleted
                    type: string
            type: object
    UnauthorizedResponse:
        description: |
            The Authorization header is missing or the token is invalid/expired.
            Possible error codes:
              - 10002: missing token
              - 10003: unauthorized
              - 10004: token expired
              - 10005: invalid token
        schema:
            properties:
                code:
                    example: 10002
                    type: string
                success:
                    example: false
                    type: boolean
                message:
                    example: missing token
                    type: string
            type: object
schemes:
    - http
    - https
securityDefinitions:
    key:
        in: header
        name: Authorization
        type: apiKey
swagger: "2.0"
